name: Build episode
on:
  push:
    branches: [main]
    paths: ["episodes-src/*.json"]
  workflow_dispatch:
    inputs:
      date: { description: "Episode date (YYYY-MM-DD)", required: true }
permissions:
  contents: write
concurrency: { group: episode, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Pick episode source
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then f="episodes-src/${{ github.event.inputs.date }}.json";
          else f=$(git diff --name-only HEAD~1 HEAD -- 'episodes-src/*.json' | tail -1); fi
          test -f "$f" || { echo "no episode source"; exit 1; }
          echo "file=$f" >> "$GITHUB_OUTPUT"
      - name: Check script
        run: python3 scripts/check_script.py "${{ steps.pick.outputs.file }}"
      - name: Build audio + feed
        env: { ELEVENLABS_API_KEY: "${{ secrets.ELEVENLABS_API_KEY }}" }
        run: python3 scripts/build_episode.py "${{ steps.pick.outputs.file }}"
      - name: Commit episode
        run: |
          git config user.name "ripple-daily-bot"
          git config user.email "ripple-daily-bot@users.noreply.github.com"
          git add episodes feed.xml
          git commit -m "Episode $(basename ${{ steps.pick.outputs.file }} .json)" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
