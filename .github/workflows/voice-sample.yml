name: Voice sample
on:
  workflow_dispatch:
    inputs:
      date: { description: "Script date to sample (YYYY-MM-DD)", required: true }
      combos: { description: "Space-separated name:lang:SU_voice:PRI_voice", required: true }
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and espeak-ng
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt }
      - name: Install Kokoro (CPU)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt
          pip install -q "misaki[en]" || true
      - name: Cache Kokoro model
        uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: kokoro-82m-v1 }
      - name: Render samples
        run: python3 scripts/voice_sample.py "episodes-src/${{ github.event.inputs.date }}.json" samples ${{ github.event.inputs.combos }}
      - name: Commit samples
        run: |
          git config user.name "ripple-daily-bot"
          git config user.email "ripple-daily-bot@users.noreply.github.com"
          git add samples
          git commit -m "Voice samples ${{ github.event.inputs.date }} [skip ci]" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
