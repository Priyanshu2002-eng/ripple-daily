name: Hinglish sample
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and espeak-ng
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            timeout 150 sudo apt-get update -qq && timeout 150 sudo apt-get install -y -qq ffmpeg espeak-ng && exit 0
            echo "apt attempt $i failed, retrying"; sleep 10
          done
          exit 1
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt }
      - name: Install Kokoro (CPU)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt
      - name: Cache Kokoro model
        uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: kokoro-82m-v1 }
      - name: Render
        run: python3 scripts/hinglish_sample.py samples-src/hinglish-sample.json samples/hi
      - name: Commit
        run: |
          git config user.name "ripple-daily-bot"
          git config user.email "ripple-daily-bot@users.noreply.github.com"
          git add samples
          git commit -m "Hinglish voice samples [skip ci]" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
